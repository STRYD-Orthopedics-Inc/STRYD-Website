<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">

<style>
  html, body { height: 100%; }
  .mil-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0b1a08;
  }
  .mil-nav {
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    background: rgba(11,26,8,0.92) !important;
    border-bottom: 1px solid rgba(80,160,60,0.15);
  }
  .mil-body-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  .mil-image-wrap {
    position: absolute;
    inset: 0;
  }
  .mil-image-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
  }
  .mil-content {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 300px;
    display: flex;
    align-items: stretch;
    padding: 24px 20px;
    z-index: 2;
  }
  .mil-tile {
    width: 100%;
    background: linear-gradient(160deg,
      rgba(30,60,20,0.65) 0%,
      rgba(20,45,15,0.50) 50%,
      rgba(10,30,8,0.65) 100%);
    backdrop-filter: blur(28px) saturate(180%) brightness(1.1);
    -webkit-backdrop-filter: blur(28px) saturate(180%) brightness(1.1);
    border: 1px solid rgba(80,160,60,0.25);
    border-radius: 14px;
    padding: 32px 24px;
    box-shadow:
      0 0 60px rgba(60,140,30,0.12),
      inset 0 1px 0 rgba(120,200,80,0.18),
      inset 0 0 0 1px rgba(80,160,60,0.08),
      inset 0 -20px 44px rgba(0,0,0,0.30),
      0 32px 80px rgba(0,0,0,0.55);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .mil-tile::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(135deg,
      rgba(140,210,100,0.35),
      rgba(80,160,60,0.18) 36%,
      transparent 62%,
      rgba(40,90,20,0.20));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .mil-tile::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      radial-gradient(140% 90% at 12% -8%, rgba(120,200,80,0.20), rgba(80,160,50,0.06) 32%, transparent 54%),
      radial-gradient(120% 80% at 110% 120%, rgba(40,100,20,0.14), transparent 48%);
    mix-blend-mode: screen;
  }
  .mil-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(140,210,100,0.85);
    margin-bottom: 20px;
  }
  .mil-status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7ecb4a;
    box-shadow: 0 0 10px #7ecb4a, 0 0 20px rgba(126,203,74,0.4);
    animation: milPulse 2.4s ease-in-out infinite;
  }
  @keyframes milPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.85); }
  }
  .mil-heading {
    font-family: var(--font-display);
    font-size: clamp(22px, 2.4vw, 30px);
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .mil-heading span {
    color: #8fd460;
    text-shadow: 0 0 20px rgba(126,203,74,0.40);
  }
  .mil-body {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.65;
    color: rgba(200,220,190,0.75);
    margin: 0;
  }
  .mil-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 26px;
    background: linear-gradient(135deg, rgba(80,160,40,0.70), rgba(50,110,20,0.55));
    border: 1px solid rgba(120,200,70,0.40);
    border-radius: 8px;
    color: #d4f0b0;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(80,160,40,0.20), inset 0 1px 0 rgba(160,220,100,0.25);
    transition: all 200ms ease;
  }
  .mil-btn:hover {
    background: linear-gradient(135deg, rgba(100,180,55,0.80), rgba(65,130,28,0.65));
    border-color: rgba(140,210,80,0.55);
    box-shadow: 0 0 32px rgba(100,180,55,0.30), inset 0 1px 0 rgba(180,240,120,0.30);
    color: #e8ffd4;
  }

  /* --- Mobile: compact tile at top so sleeve is fully visible --- */
  @media (max-width: 768px) {
    .mil-content {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      bottom: auto;
      width: auto;
      padding: 0;
      align-items: stretch;
    }
    .mil-tile {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
    }
    .mil-tile > * { flex-shrink: 0; }
    .mil-heading { font-size: 18px; flex: 1 1 auto; }
    .mil-body { display: none; }
    .mil-status { margin-bottom: 0 !important; }
    .mil-tile > div[style*="flex:1"] { display: none; }
    .mil-btn { padding: 10px 18px; font-size: 11px; white-space: nowrap; }
  }
  @media (max-width: 480px) {
    .mil-tile { padding: 12px 14px; gap: 8px; }
    .mil-heading { font-size: 16px; }
    .mil-btn { padding: 9px 14px; font-size: 10px; }
  }
</style>
</head>
