<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Join the waitlist | STRYD</title>
<meta name="description" content="Be among the first to get STRYD, the wearable for knee health.">
<script>(function(){try{var t=localStorage.getItem('stryd_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/waitlist.css">
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="wl-header">
  <a class="wl-logo" href="/" aria-label="STRYD Orthopedics home"><img src="/assets/images/logo-transparent-png.png" alt="STRYD Orthopedics"></a>
  <nav aria-label="Primary">
    <a class="wl-home" href="/">Home</a>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </nav>
</header>

<main id="main">
  <div class="wl-wrap">
    <div class="glass-panel">
      <div class="counter" data-waitlist-counter hidden><span class="n" data-count>0</span><span>on the waitlist</span></div>
      <h1>Join the waitlist</h1>
      <p class="lede">Be among the first to get STRYD, the wearable for knee health.</p>

      <form id="waitlist-form" novalidate>
        <div id="wl-form-error" class="field-error form-error" role="alert" hidden></div>

        <div class="group">
          <div class="field">
            <label for="wl-email">Email address <span class="req" aria-hidden="true">*</span></label>
            <input class="control ph-no-capture" id="wl-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" aria-required="true" aria-describedby="err-email">
            <div class="field-error" id="err-email" role="alert" hidden></div>
          </div>
        </div>

        <div class="group">
          <fieldset class="field" aria-describedby="err-segment">
            <legend class="label">Which best describes you? <span class="req" aria-hidden="true">*</span></legend>
            <div class="seg-group" id="seg-group">
        <label class="seg"><input type="radio" name="segment" value="parent_travel_hs" aria-describedby="err-segment"><span class="seg-card"><span>Parent of a travel or high school athlete</span><span class="check"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg></span></span></label>
        <label class="seg"><input type="radio" name="segment" value="runner_active_adult" aria-describedby="err-segment"><span class="seg-card"><span>Runner or active adult</span><span class="check"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg></span></span></label>
        <label class="seg"><input type="radio" name="segment" value="pro_college_athlete" aria-describedby="err-segment"><span class="seg-card"><span>College or pro athlete</span><span class="check"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg></span></span></label>
        <label class="seg"><input type="radio" name="segment" value="other" aria-describedby="err-segment"><span class="seg-card"><span>Other</span><span class="check"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg></span></span></label>
            </div>
            <div class="field-error" id="err-segment" role="alert" hidden></div>
          </fieldset>
        </div>

        <div class="group">
          <div class="field">
            <label for="wl-sport">Your sport (or your athlete's sport), optional</label>
            <input class="control" id="wl-sport" name="sport" type="text" maxlength="80" autocomplete="off" placeholder="e.g. soccer, running, Hyrox" aria-describedby="err-sport">
            <div class="field-error" id="err-sport" role="alert" hidden></div>
          </div>

          <div class="field">
            <label for="wl-heard">Where did you hear about us? <span class="req" aria-hidden="true">*</span></label>
            <div class="select-wrap">
              <select class="control" id="wl-heard" name="where_heard" aria-required="true" aria-describedby="err-where_heard">
                <option value="" disabled selected>Select one</option>
                <option value="tiktok">TikTok</option>
                <option value="instagram">Instagram</option>
                <option value="youtube">YouTube</option>
                <option value="linkedin">LinkedIn</option>
                <option value="x">X</option>
                <option value="friend_referral">A friend</option>
                <option value="event_flyer">An event or flyer</option>
                <option value="search">Search</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field-error" id="err-where_heard" role="alert" hidden></div>
          </div>

          <div class="field" id="wl-other-wrap" hidden>
            <label for="wl-heard-other">Tell us where <span class="req" aria-hidden="true">*</span></label>
            <input class="control" id="wl-heard-other" name="where_heard_other" type="text" maxlength="120" autocomplete="off" aria-describedby="err-where_heard_other">
            <div class="field-error" id="err-where_heard_other" role="alert" hidden></div>
          </div>
        </div>

        <div class="group">
          <div class="check-row">
            <input type="checkbox" id="wl-age" name="age_attested" aria-required="true" aria-describedby="err-age_attested">
            <label for="wl-age">I'm 18 or older. <span class="req" aria-hidden="true">*</span></label>
          </div>
          <div class="field-error" id="err-age_attested" role="alert" hidden></div>
          <div class="check-row" style="margin-top:12px;">
            <input type="checkbox" id="wl-consent" name="consent" aria-required="true" aria-describedby="err-consent">
            <label for="wl-consent">I agree to the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy<span class="sr-only"> (opens in a new tab)</span></a> and to receive email updates from STRYD. I can unsubscribe anytime. <span class="req" aria-hidden="true">*</span></label>
          </div>
          <div class="field-error" id="err-consent" role="alert" hidden></div>
        </div>

        <div class="hp" aria-hidden="true"><label>Website<input type="text" name="company_website" tabindex="-1" autocomplete="off"></label></div>

        <button class="btn-primary" type="submit">Join the waitlist</button>
        <p class="help" style="margin-top:16px;">Fields marked * are required.</p>
      </form>
    </div>
  </div>
</main>

<footer class="wl-footer">
  <div class="links">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms</a>
    <button type="button" class="cookie-link" data-cookie-settings>Cookie settings</button>
  </div>
  <p>&copy; 2026 STRYD Orthopedics, Inc.</p>
</footer>

<script src="/assets/theme.js"></script>
<script src="/assets/consent.js"></script>
<script src="/assets/analytics.js"></script>
<script src="/assets/waitlist.js"></script>
</body>
</html>
